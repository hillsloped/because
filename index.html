  .details { font-size: 14px; display: grid; gap: 8px; }

  .swatch { width: 18px; height: 18px; border: 2px solid var(--ink); display: inline-block; }
  .pieces { list-style: none; display: grid; gap: 4px; }

  .card.active { border-color: var(--accent); box-shadow: none; outline: 3px solid var(--accent); }
  .thumb {
    aspect-ratio: 16 / 9;

    justify-content: center;

    font-weight: 700;
    font-size: 14px;
    line-height: 1.2;

    overflow: hidden;

    font-size: 12px;

    justify-content: space-between;

  .empty { color: var(--muted); font-size: 14px; }
  footer { max-width: 1000px; margin: 0 auto; padding: 0 24px 32px; color: var(--muted); font-size: 12px; }

/* ---------- Common words ---------- */
const COMMON = [
  "the", "a", "and", "is", "it", "you", "we", "they", "this", "that", "not", "very", "just", "so",
  "maybe", "yes", "no", "why", "because", "what", "where", "when", "how", "now", "then", "again",
  "big", "small", "red", "blue", "green", "loud", "quiet", "fast", "slow", "good", "bad", "new", "old",
  "cat", "dog", "duck", "frog", "fish", "bird", "moon", "sun", "sky", "cloud", "rain", "tree", "rock",
  "toast", "soup", "bread", "pizza", "spoon", "door", "chair", "lamp", "sock", "shoe", "hat", "box",
  "run", "jump", "eat", "sleep", "think", "look", "go", "stop", "wait", "dance", "sing", "fall",
  "today", "tomorrow", "never", "always", "here", "there", "up", "down", "inside", "outside",
  "hello", "goodbye", "please", "thanks", "okay", "wow", "huh", "oops", "yay", "help"
];

/* Words the made-up words borrow letters from */
const SOURCE_WORDS = [...new Set(
  COMMON.concat(REFERENCE.join(" ").toLowerCase().split(/[^a-z']+/))
    .map(w => w.replace(/[^a-z]/g, ""))
    .filter(w => w.length >= 2)
)];

/* ---------- Random helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const round1 = x => Math.round(x * 10) / 10;

/* ---------- Text generator ---------- */

// Take 1 or 2 letters in a row from a word
function chunkFrom(word) {
  const len = Math.min(randInt(1, 2), word.length);
  const start = randInt(0, word.length - len);
  return word.slice(start, start + len);
}

// Build a made-up word from 1-2 letter chunks of 2-3 real words
function madeUpWord() {
  let w = "";
  const parts = randInt(2, 3);
  for (let i = 0; i < parts; i++) w += chunkFrom(pick(SOURCE_WORDS));
  if (w.length < 3) w += chunkFrom(pick(SOURCE_WORDS));
  return w;
}

// 50/50 chance the made-up word is allowed in. Returns null if not.
function tryMadeUp() {
  return chance(0.5) ? madeUpWord() : null;
}

function makeText() {
  const r = Math.random();

  // 1) A whole reference sentence
  if (r < 0.30) return pick(REFERENCE);

  // 2) Part of a reference sentence
  if (r < 0.50) {
    const words = pick(REFERENCE).split(" ");
    const n = Math.min(words.length, randInt(2, Math.max(2, words.length)));
    const start = randInt(0, words.length - n);
    return words.slice(start, start + n).join(" ");
  }

  // 3) A reference sentence with some words swapped for made-up ones
  if (r < 0.75) {
    return pick(REFERENCE).split(" ").map(w => {
      if (!chance(0.3)) return w;
      return tryMadeUp() ?? w;
    }).join(" ");
  }

  // 4) A random jumble of common words and made-up words
  const out = [];
  const n = randInt(2, 6);
  for (let i = 0; i < n; i++) {
    if (chance(0.5)) out.push(pick(COMMON));
    else {
      const m = tryMadeUp();
      if (m) out.push(m);
    }
  }
  if (!out.length) out.push(pick(COMMON));
  return out.join(" ");
}

/* ---------- Colors ---------- */
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return "#" + [f(0), f(8), f(4)].map(x => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
}
function randomColor() {
  return hslToHex(randInt(0, 359), randInt(35, 95), randInt(18, 82));
}
function textColorFor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum > 0.55 ? "#111111" : "#ffffff";
}

/* ---------- The "AI": decides everything about a video ---------- */
function generateRecipe() {
  const duration = round1(rand(MIN_SECONDS, MAX_SECONDS));
  const background = randomColor();
  const pieces = [];

  let t = round1(rand(0, 0.5));
  while (duration - t >= 0.8) {
    const len = Math.min(rand(0.8, 4), duration - t);
    const end = Math.min(duration, round1(t + len));
    pieces.push({ text: makeText(), start: t, end });
    t = round1(end + rand(0, 0.6));
  }
  if (!pieces.length) pieces.push({ text: makeText(), start: 0, end: duration });

  return { duration, background, textColor: textColorFor(background), pieces };
}

/* ---------- Drawing ---------- */
const FONT = s => `700 ${s}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;

function wrap(c, text, maxW) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function fitText(c, text) {
  const maxW = W * 0.84;
  for (let s = 84; s >= 24; s -= 4) {
    c.font = FONT(s);
    const lines = wrap(c, text, maxW);
    if (lines.length <= 4 && lines.every(l => c.measureText(l).width <= maxW)) return { size: s, lines };
  }
  c.font = FONT(24);
  return { size: 24, lines: wrap(c, text, maxW) };
}

function drawFrame(c, recipe, t) {
  c.fillStyle = recipe.background;
  c.fillRect(0, 0, W, H);
  const p = recipe.pieces.find(p => t >= p.start && t < p.end);
  if (!p) return;
  const { size, lines } = fitText(c, p.text);
  c.fillStyle = recipe.textColor;
  c.textAlign = "center";
  c.textBaseline = "middle";
  const lh = size * 1.2;
  const y0 = H / 2 - ((lines.length - 1) * lh) / 2;
  lines.forEach((l, i) => c.fillText(l, W / 2, y0 + i * lh));
}

function drawIdle(c) {
  c.fillStyle = "#161616";
  c.fillRect(0, 0, W, H);
  c.fillStyle = "#f2efe6";
  c.font = FONT(64);
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillText("Because", W / 2, H / 2);
}

/* ---------- Recording ---------- */
function pickMime() {
  if (!window.MediaRecorder) return null;
  const options = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"];
  return options.find(m => MediaRecorder.isTypeSupported(m)) || null;
}

async function recordRecipe(recipe, canvas, onProgress) {
  const c = canvas.getContext("2d");
  const mime = pickMime();
  if (!mime || !canvas.captureStream) return null;

  const stream = canvas.captureStream(FPS);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 1500000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => (rec.onstop = r));

  drawFrame(c, recipe, 0);
  rec.start(250);
  const t0 = performance.now();

  await new Promise(resolve => {
    const id = setInterval(() => {
      const t = (performance.now() - t0) / 1000;
      if (t >= recipe.duration) {
        clearInterval(id);
        drawFrame(c, recipe, recipe.duration - 0.001);
        onProgress(1);
        resolve();
        return;
      }
      drawFrame(c, recipe, t);
      onProgress(t / recipe.duration);
    }, 1000 / FPS);
  });

  rec.stop();
  await stopped;
  stream.getTracks().forEach(tr => tr.stop());
  return { blob: new Blob(chunks, { type: mime.split(";")[0] }), mime };
}

/* ---------- Storage (IndexedDB, falls back to memory) ---------- */
const store = {
  db: null,
  mem: [],
  init() {
    return new Promise(resolve => {
      try {
        const req = indexedDB.open("because", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("videos", { keyPath: "id" });
        req.onsuccess = () => { this.db = req.result; resolve(); };
        req.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  },
  _req(mode, fn) {
    return new Promise((resolve, reject) => {
      const os = this.db.transaction("videos", mode).objectStore("videos");
      const r = fn(os);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  },
  async all() {
    const items = this.db ? await this._req("readonly", os => os.getAll()) : this.mem.slice();
    return items.sort((a, b) => b.created - a.created);
  },
  async put(item) {
    if (this.db) {
      try { return await this._req("readwrite", os => os.put(item)); }
      catch (e) { console.warn("Save failed, keeping in memory", e); }
    }
    this.mem = this.mem.filter(i => i.id !== item.id).concat(item);
  },
  async del(id) {
    if (this.db) { try { await this._req("readwrite", os => os.delete(id)); } catch (e) {} }
    this.mem = this.mem.filter(i => i.id !== id);
  }
};

async function trimGallery() {
  const items = await store.all();
  for (const old of items.slice(MAX_GALLERY)) await store.del(old.id);
}

function nextNumber() {
  let n = 1;
  try {
    n = (parseInt(localStorage.getItem("because-count") || "0", 10) || 0) + 1;
    localStorage.setItem("because-count", String(n));
  } catch (e) {
    n = (window.__becauseCount = (window.__becauseCount || 0) + 1);
  }
  return n;
}

/* ---------- UI ---------- */
const $ = s => document.querySelector(s);
const els = {
  canvas: $("#canvas"), video: $("#video"), gen: $("#generate"), status: $("#status"),
  bar: $("#bar > div"), details: $("#details"), gallery: $("#gallery"), count: $("#count"), footer: $("#footer")
};
const ctx = els.canvas.getContext("2d");
let busy = false;
let currentId = null;
let canvasLoop = null;
const urls = new Map();

const setStatus = s => (els.status.textContent = s);
const setProgress = p => (els.bar.style.width = Math.round(p * 100) + "%");

function stopCanvasLoop() {
  if (canvasLoop) cancelAnimationFrame(canvasLoop);
  canvasLoop = null;
}
function showCanvas() {
  els.video.pause();
  els.video.hidden = true;
  els.canvas.hidden = false;
}
function showVideo() {
  stopCanvasLoop();
  els.canvas.hidden = true;
  els.video.hidden = false;
}
function playOnCanvas(recipe) {
  stopCanvasLoop();
  showCanvas();
  const t0 = performance.now();
  const step = () => {
    const t = ((performance.now() - t0) / 1000) % recipe.duration;
    drawFrame(ctx, recipe, t);
    canvasLoop = requestAnimationFrame(step);
  };
  step();
}

// MediaRecorder webm files often report an endless duration; this fixes the seek bar
els.video.addEventListener("loadedmetadata", () => {
  const v = els.video;
  if (v.duration === Infinity) {
    v.currentTime = 1e101;
    v.addEventListener("timeupdate", function fix() {
      v.removeEventListener("timeupdate", fix);
      v.currentTime = 0;
      v.play().catch(() => {});
    });
  }
});

function urlFor(item) {
  if (!item.blob) return null;
  if (!urls.has(item.id)) urls.set(item.id, URL.createObjectURL(item.blob));
  return urls.get(item.id);
}

function fileExt(item) {
  return item.mime && item.mime.includes("mp4") ? "mp4" : "webm";
}

function download(item) {
  const url = urlFor(item);
  if (!url) return;
  const a = document.createElement("a");
  a.href = url;
  a.download = `because-${item.num}.${fileExt(item)}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function showDetails(item) {
  els.details.innerHTML = "";
  const head = document.createElement("div");
  head.className = "head";
  const sw = document.createElement("span");
  sw.className = "swatch";
  sw.style.background = item.background;
  const label = document.createElement("span");
  label.textContent = `Because #${item.num} · ${item.duration}s · ${item.background} · ${item.pieces.length} text${item.pieces.length === 1 ? "" : "s"}`;
  head.append(sw, label);

  const list = document.createElement("ul");
  list.className = "pieces";
  for (const p of item.pieces) {
    const li = document.createElement("li");
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = `${p.start.toFixed(1)}s – ${p.end.toFixed(1)}s`;
    const x = document.createElement("span");
    x.textContent = p.text;
    li.append(t, x);
    list.append(li);
  }
  els.details.append(head, list);
}

function openItem(item) {
  currentId = item.id;
  showDetails(item);
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.id === item.id));
  const url = urlFor(item);
  if (url) {
    showVideo();
    if (els.video.src !== url) els.video.src = url;
    els.video.currentTime = 0;
    els.video.play().catch(() => {});
  } else {
    playOnCanvas(item);
  }
}

async function renderGallery() {
  const items = await store.all();
  // free URLs for deleted videos
  for (const [id, url] of urls) {
    if (!items.some(i => i.id === id)) { URL.revokeObjectURL(url); urls.delete(id); }
  }
  els.count.textContent = `${items.length} / ${MAX_GALLERY}`;
  els.gallery.innerHTML = "";
  if (!items.length) {
    const e = document.createElement("p");
    e.className = "empty";
    e.textContent = "No videos yet. Your newest 20 will show up here.";
    els.gallery.append(e);
    return items;
  }
  for (const item of items) {
    const card = document.createElement("div");
    card.className = "card" + (item.id === currentId ? " active" : "");
    card.dataset.id = item.id;

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    thumb.style.background = item.background;
    thumb.style.color = item.textColor;
    thumb.textContent = item.pieces[0] ? item.pieces[0].text : "";
    thumb.title = "Play";
    thumb.onclick = () => !busy && openItem(item);

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<b>#${item.num}</b><span>${item.duration}s · ${item.pieces.length} text${item.pieces.length === 1 ? "" : "s"}</span>`;

    const row = document.createElement("div");
    row.className = "row";
    const play = document.createElement("button");
    play.textContent = "Play";
    play.onclick = () => !busy && openItem(item);
    const dl = document.createElement("button");
    dl.textContent = "Download";
    dl.disabled = !item.blob;
    if (!item.blob) dl.title = "This browser could not record a video file";
    dl.onclick = () => download(item);
    row.append(play, dl);

    card.append(thumb, meta, row);
    els.gallery.append(card);
  }
  return items;
}

async function generate() {
  if (busy) return;
  busy = true;
  els.gen.disabled = true;
  stopCanvasLoop();
  showCanvas();
  setProgress(0);

  const recipe = generateRecipe();
  const item = {
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 7),
    num: nextNumber(),
    created: Date.now(),
    ...recipe,
    blob: null,
    mime: null
  };
  currentId = item.id;
  showDetails(item);
  setStatus(`Making Because #${item.num} (${item.duration}s)… keep this tab open.`);

  try {
    const res = await recordRecipe(recipe, els.canvas, setProgress);
    if (res && res.blob.size) { item.blob = res.blob; item.mime = res.mime; }
  } catch (e) {
    console.error("Recording failed", e);
  }

  await store.put(item);
  await trimGallery();
  await renderGallery();
  openItem(item);
  setProgress(1);
  setStatus(item.blob
    ? `Because #${item.num} is ready.`
    : `Because #${item.num} is ready. This browser can't record video files, so it plays as a live preview only.`);

  busy = false;
  els.gen.disabled = false;
}

/* ---------- Start ---------- */
(async function start() {
  drawIdle(ctx);
  els.footer.textContent = `Because v0.1 · ${REFERENCE.length} reference sentences · videos are saved in this browser only`;
  els.gen.onclick = generate;
  await store.init();
  const items = await renderGallery();
  if (items.length) {
    setStatus("Press Generate to make a video, or play one from the gallery.");
  }
})();
</script>
</body>
